name: aeenci_app
description: "Application mobile des membres de l'AEENCI."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  connectivity_plus: ^7.3.2
  dio: ^5.11.1
  flutter_riverpod: ^3.3.1
  flutter_secure_storage: ^11.2.0
  flutter_svg: ^2.3.0
  freezed_annotation: ^3.1.0
  go_router: ^18.1.0
  intl: ^0.20.2
  json_annotation: ^4.11.0
  lucide_icons_flutter: ^4.0.0
  package_info_plus: ^10.2.2
  path_provider: ^2.1.6
  riverpod_annotation: ^4.0.2
  url_launcher: ^6.3.3
  qr_flutter: ^4.1.0
  screen_brightness: ^2.1.11
  cached_network_image: ^4.0.3
  add_2_calendar: ^3.1.1
  share_plus: ^13.3.1
  open_filex: ^5.0.0
  image_picker: ^1.2.4
  file_picker: ^13.1.0
  firebase_core: ^5.0.0
  firebase_messaging: ^17.0.0
  flutter_local_notifications: ^22.3.2
  flutter_markdown_plus: ^1.0.12

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter

  build_runner: ^2.15.1
  flutter_lints: ^6.0.0
  # freezed 4 stable demande Dart 3.13 ; les versions 3.2.6+ sont des
  # préversions. 3.2.5 est la dernière stable compatible avec Dart 3.12.
  freezed: 3.2.5
  json_serializable: ^6.13.0
  mocktail: ^1.0.5
  riverpod_generator: ^4.0.3
  flutter_launcher_icons: ^0.14.4
  flutter_native_splash: ^2.4.8

flutter:
  uses-material-design: true
  generate: true

  assets:
    - assets/logos/

  fonts:
    - family: Bricolage Grotesque
      fonts:
        - asset: assets/fonts/BricolageGrotesque-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/BricolageGrotesque-Bold.ttf
          weight: 700
        - asset: assets/fonts/BricolageGrotesque-ExtraBold.ttf
          weight: 800
    - family: Plus Jakarta Sans
      fonts:
        - asset: assets/fonts/PlusJakartaSans-Regular.ttf
          weight: 400
        - asset: assets/fonts/PlusJakartaSans-Medium.ttf
          weight: 500
        - asset: assets/fonts/PlusJakartaSans-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/PlusJakartaSans-Bold.ttf
          weight: 700
